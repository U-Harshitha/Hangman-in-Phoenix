# Render's free plan sleeps a service after 15 idle minutes; the first
# visit then takes ~30-60 s. This pings the health check so the game
# opens instantly from the portfolio. Set the repository variable
# HANGMAN_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://hangman-in-phoenix.onrender.com — until then it's a no-op.
name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.HANGMAN_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --max-time 60 "${{ vars.HANGMAN_URL }}/hangman/health"
